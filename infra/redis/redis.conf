# Redis configuration for Mawazo local development
# Production should use a managed Redis service (Upstash, AWS ElastiCache, etc.)

# Save to disk every 60s if at least 1 key changed
save 60 1

# Maximum memory (adjust for your machine)
maxmemory 256mb

# Evict the least-recently-used keys first when maxmemory is hit
maxmemory-policy allkeys-lru

# Log level: debug, verbose, notice, warning
loglevel notice

# Append-only file for durability (optional for dev)
appendonly no

# Disable protected mode for Docker networking
protected-mode no
