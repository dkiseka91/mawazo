services:
  - type: web
    name: mawazo-webhook
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build:ordered
    startCommand: NODE_ENV=production node packages/database/dist/run-migrations.js && node packages/webhook/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mawazo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mawazo-redis
          type: redis
          property: connectionString
      - key: LOG_LEVEL
        value: info
      # Set these manually in Render dashboard after first deploy:
      # ANTHROPIC_API_KEY
      # TELEGRAM_BOT_TOKEN
      # TELEGRAM_WEBHOOK_SECRET
      # ADMIN_SECRET
      # WEBAPP_BASE_URL         — your public Render URL e.g. https://mawazo-webhook.onrender.com
      # MTN MoMo (optional — enables automated subscription payments):
      # MOMO_SUBSCRIPTION_KEY   — from momodeveloper.mtn.com
      # MOMO_API_USER           — UUID created via provisioning API
      # MOMO_API_KEY            — generated via provisioning API
      # MOMO_BASE_URL           — https://sandbox.momodeveloper.mtn.com OR https://proxy.momoapi.mtn.com
      # MOMO_TARGET_ENVIRONMENT — sandbox OR mtnuganda
      # MOMO_CALLBACK_URL       — https://your-app.onrender.com/momo/callback

databases:
  - name: mawazo-db
    plan: free
    region: oregon

  - name: mawazo-redis
    plan: free
    region: oregon
    ipAllowList: []
